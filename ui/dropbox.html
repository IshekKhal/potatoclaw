<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotatoClaw DropBox</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/dropbox.css">
</head>
<body>
  <div class="dropbox-wrapper">
    <div id="dropboxPill" class="dropbox-pill" data-tauri-drag-region title="PotatoClaw DropBox: Drag files here or click to open HUD">
      <!-- Potato Claw Paw Emblem SVG -->
      <svg class="dropbox-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z" fill="#f59e0b"/>
        <circle cx="8" cy="8" r="1.6" fill="#fef3c7"/>
        <circle cx="12" cy="6.2" r="1.6" fill="#fef3c7"/>
        <circle cx="16" cy="8" r="1.6" fill="#fef3c7"/>
        <path d="M7 13.5c1.5 2 4.5 3 5 3s3.5-1 5-3" stroke="#fef3c7" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div id="dropBadge" class="dropbox-badge">0</div>
    </div>

    <!-- Custom Right-Click Context Menu -->
    <div id="contextMenu" class="context-menu">
      <button id="menuOpenHud" class="context-menu-item">
        <span>💬</span> Open HUD
      </button>
      <button id="menuTrimRam" class="context-menu-item">
        <span>🛡️</span> Trim RAM
      </button>
      <button id="menuHidePill" class="context-menu-item">
        <span>✕</span> Hide Pill
      </button>
    </div>
  </div>

  <script src="js/dropbox.js"></script>
</body>
</html>
