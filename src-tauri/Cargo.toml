[package]
name = "potatoclaw"
version = "0.1.0"
description = "Anti-Thrash AI Copilot for 8GB RAM Laptops"
authors = ["Abhishek Khanra"]
edition = "2021"

[lib]
name = "potatoclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
] }
xcap = { version = "0.9.8", default-features = false }
image = "0.25"
chrono = "0.4"
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream", "form"] }
tokio = { version = "1.53.1", features = ["full"] }
cpal = "0.18.2"
hound = "3.5.1"


